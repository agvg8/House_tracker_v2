<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>budujemy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  (function(){
    var saved = localStorage.getItem('theme');
    if(saved){ document.documentElement.setAttribute('data-theme', saved); }
  })();
</script>
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">{{ icon('home') }} budujemy</a>
  <nav>
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('index') }}">moje projekty</a>
    <a href="{{ url_for('robocze') }}">robocze</a>
    <a href="{{ url_for('account') }}">konto</a>
    <a href="{{ url_for('logout') }}">wyloguj</a>
    {% else %}
    <a href="{{ url_for('login') }}">zaloguj</a>
    <a href="{{ url_for('register') }}">zarejestruj się</a>
    {% endif %}
    <button id="theme-toggle" class="btn theme-btn" type="button" aria-label="przełącz motyw">
      <span id="icon-moon">{{ icon('moon') }}</span><span id="icon-sun" style="display:none;">{{ icon('sun') }}</span>
    </button>
  </nav>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script>
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var iconMoon = document.getElementById('icon-moon');
  var iconSun = document.getElementById('icon-sun');
  function updateIcon(){
    var dark = root.getAttribute('data-theme') === 'dark';
    iconMoon.style.display = dark ? 'none' : 'inline-block';
    iconSun.style.display = dark ? 'inline-block' : 'none';
  }
  updateIcon();
  btn.addEventListener('click', function(){
    var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateIcon();
  });
</script>
<script>
  document.querySelectorAll('.type-card').forEach(function(card){
    var input = card.querySelector('input[type=radio]');
    function sync(){
      card.parentElement.querySelectorAll('.type-card').forEach(function(c){ c.classList.remove('selected'); });
      if (input.checked) card.classList.add('selected');
    }
    input.addEventListener('change', function(){
      card.parentElement.querySelectorAll('.type-card').forEach(function(c){ c.classList.remove('selected'); });
      card.classList.add('selected');
    });
    sync();
  });
</script>
</body>
</html>

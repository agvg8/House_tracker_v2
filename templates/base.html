<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>budujemy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  (function(){
    var saved = localStorage.getItem('theme');
    if(saved){ document.documentElement.setAttribute('data-theme', saved); }
  })();
</script>
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">{{ icon('home') }} budujemy</a>

  <nav id="main-nav">
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('index') }}">moje projekty</a>
    <a href="{{ url_for('robocze') }}">robocze</a>
    <a href="{{ url_for('account') }}">konto</a>
    <a href="{{ url_for('logout') }}">wyloguj</a>
    {% else %}
    <a href="{{ url_for('login') }}">zaloguj</a>
    <a href="{{ url_for('register') }}">zarejestruj się</a>
    {% endif %}
    <button id="theme-toggle" class="btn theme-btn" type="button" aria-label="przełącz motyw">
      <span id="icon-moon">{{ icon('moon') }}</span><span id="icon-sun" style="display:none;">{{ icon('sun') }}</span>
    </button>
  </nav>
<!--
  <div class="topbar-right">
    <button id="menu-toggle" class="btn theme-btn menu-only" type="button" aria-label="menu" aria-expanded="false">
      {{ icon('menu-2') }}
    </button>
  </div>-->
</header>
<div id="nav-backdrop"></div>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script>
  var menuBtn = document.getElementById('menu-toggle');
  var nav = document.getElementById('main-nav');
  var backdrop = document.getElementById('nav-backdrop');
  function closeMenu(){
    nav.classList.remove('open');
    backdrop.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', function(){
    var isOpen = nav.classList.toggle('open');
    backdrop.classList.toggle('open', isOpen);
    menuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  backdrop.addEventListener('click', closeMenu);
  nav.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeMenu); });
</script>
<script>
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var iconMoon = document.getElementById('icon-moon');
  var iconSun = document.getElementById('icon-sun');
  function updateIcon(){
    var dark = root.getAttribute('data-theme') === 'dark';
    iconMoon.style.display = dark ? 'none' : 'inline-block';
    iconSun.style.display = dark ? 'inline-block' : 'none';
  }
  updateIcon();
  btn.addEventListener('click', function(){
    var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateIcon();
  });
</script>
<script>
  document.querySelectorAll('.type-picker').forEach(function(picker){
    function sync(){
      picker.querySelectorAll('.type-card').forEach(function(c){
        var input = c.querySelector('input[type=radio]');
        c.classList.toggle('selected', !!(input && input.checked));
      });
    }
    picker.addEventListener('change', sync);
    sync();
  });
</script>
</body>
</html>
